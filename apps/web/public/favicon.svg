<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gold bar with shine effect -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Main gold bar shape -->
  <path d="M 20 35 L 80 35 L 75 65 L 25 65 Z" fill="url(#goldGradient)" stroke="#B8860B" stroke-width="2"/>

  <!-- Top face of gold bar (3D effect) -->
  <path d="M 20 35 L 25 30 L 85 30 L 80 35 Z" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>

  <!-- Right face of gold bar (3D effect) -->
  <path d="M 80 35 L 85 30 L 80 60 L 75 65 Z" fill="#DAA520" stroke="#B8860B" stroke-width="1.5"/>

  <!-- Shine effect -->
  <rect x="30" y="40" width="35" height="15" fill="url(#shineGradient)" opacity="0.5" rx="2"/>

  <!-- "Au" text (gold symbol from periodic table) -->
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#8B4513" text-anchor="middle">Au</text>
</svg>
